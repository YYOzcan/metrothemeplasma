# MetroThemePlasma: Metro oturumunda Windows 8.1 Kullanıcı Hesabı Denetimi (metro-uac);
# diğer oturumlarda önceki davranış (AeroThemePlasma'nın UAC aracısı ya da KDE'ninki).
# İkili yoksa (kaldırıldıysa) da KDE'nin aracısına düşer: kimlik doğrulama hiç aracısız kalmaz.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'A="$${HOME}/.local/share/metrothemeplasma/bin/metro-uac"; if [ "$${DESKTOP_SESSION}" = metrothemeplasma ] && [ -x "$$A" ]; then exec "$$A"; elif [ -n "$${USE_UAC_AGENT}" ] && [ -x /usr/lib/uac-polkit-agent ]; then exec /usr/lib/uac-polkit-agent; else exec /usr/lib/polkit-kde-authentication-agent-1; fi'
