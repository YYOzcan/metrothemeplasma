<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- MetroThemePlasma oturumu: Windows 8.1'in kendi Segoe UI ailesi (kendi kopyandan) sistemdekilerin önüne geçer.
     Yalnızca Metro oturumunda FONTCONFIG_FILE ile etkin; diğer oturumlar etkilenmez. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>~/.local/share/metrothemeplasma/yazitipi</dir>
  <cachedir>~/.cache/metrothemeplasma/fontconfig</cachedir>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/*/segoeui*.ttf</glob>
      <glob>/usr/share/fonts/*/segui*.ttf</glob>
      <glob>/usr/share/fonts/segoeui*.ttf</glob>
      <glob>/usr/share/fonts/segui*.ttf</glob>
      <glob>/usr/local/share/fonts/*/segoeui.ttf</glob>
      <glob>/usr/local/share/fonts/*/segoeui[blisz].ttf</glob>
      <glob>/usr/local/share/fonts/*/segoeuisl.ttf</glob>
      <glob>/usr/local/share/fonts/*/segui*.ttf</glob>
    </rejectfont>
  </selectfont>
  <!-- Windows 8 ClearType benzeri: hafif ipucu, alt piksel -->
  <match target="font">
    <test name="family" compare="contains"><string>Segoe UI</string></test>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
