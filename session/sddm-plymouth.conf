# MetroThemePlasma: Windows 8.1 gibi açılış logosundan oturum açma ekranına konsol görünmeden geçiş.
# GDM'nin yöntemi: SDDM başlarken Plymouth kapatılmaz, yalnız ekranı bırakır (deactivate); SDDM'nin
# ekranı gelince son kare ekranda kalarak kapanır (quit --retain-splash). SDDM başlayamazsa Plymouth
# yine kapanır (OnFailure), açılış asla logoda takılı kalmaz.
[Unit]
Conflicts=plymouth-quit.service
After=plymouth-quit.service
OnFailure=plymouth-quit.service

[Service]
ExecStartPre=-/usr/bin/plymouth deactivate
ExecStartPost=-/usr/bin/sleep 2
ExecStartPost=-/usr/bin/plymouth quit --retain-splash
